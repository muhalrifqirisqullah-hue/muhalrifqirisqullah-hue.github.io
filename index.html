<script>
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ================= PLAYER =================
let player = {
  x: 100,
  y: 100,
  speed: 3,
  moving: false
};

// ================= LOAD IMAGE =================
const playerImg = new Image();
playerImg.src = "vecteezy_cute-cat-football-player_49888125.png";

// ================= CONTROL =================
let keys = {};

document.addEventListener("keydown", (e)=>{
  keys[e.key] = true;
});

document.addEventListener("keyup", (e)=>{
  keys[e.key] = false;
});

// ================= ANIMASI =================
let frame = 0;
let frameSpeed = 0.2; // makin besar makin cepat

function update(){
  player.moving = false;

  if(keys["ArrowUp"]){
    player.y -= player.speed;
    player.moving = true;
  }
  if(keys["ArrowDown"]){
    player.y += player.speed;
    player.moving = true;
  }
  if(keys["ArrowLeft"]){
    player.x -= player.speed;
    player.moving = true;
  }
  if(keys["ArrowRight"]){
    player.x += player.speed;
    player.moving = true;
  }

  if(player.moving){
    frame += frameSpeed;
  } else {
    frame = 0;
  }
}

// ================= DRAW =================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // animasi goyang dikit (fake animation)
  let bounce = Math.sin(frame) * 3;

  ctx.drawImage(
    playerImg,
    player.x,
    player.y + bounce,
    50,
    50
  );
}

// ================= LOOP =================
function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
    </script>
