<!DOCTYPE html>
<html>
<head>
  <title>BrainRank World 🌍</title>

  <style>
    body{
      font-family:sans-serif;
      text-align:center;
      background:#0f172a;
      color:white;
      transition:0.5s;
    }

    .card{
      margin:20px;
      padding:20px;
      background:#1e293b;
      border-radius:15px;
      animation:fade 0.5s;
    }

    button{
      padding:10px;
      margin:5px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-size:16px;
    }

    @keyframes fade{
      from{opacity:0;transform:translateY(20px);}
      to{opacity:1;}
    }
  </style>
</head>

<body>

<!-- SOUND -->
<audio id="benar" src="https://www.soundjay.com/buttons/sounds/button-4.mp3"></audio>
<audio id="salah" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<!-- LOGIN -->
<div id="login" class="card">
  <h1>🧠 BrainRank World</h1>
  <input id="nama" placeholder="Nama kamu"><br><br>

  <button onclick="start('easy')">Easy 😄</button>
  <button onclick="start('medium')">Medium 😎</button>
  <button onclick="start('hard')">Hard 😈</button>
  <button onclick="start('extreme')">Extreme 🔥</button>
</div>

<!-- GAME -->
<div id="game" class="card" style="display:none">
  <h2 id="info"></h2>
  <h3 id="soal"></h3>
  <div id="jawaban"></div>
</div>

<!-- HASIL -->
<div id="hasil" class="card" style="display:none">
  <h2 id="skor"></h2>
  <button onclick="lihatRanking()">Ranking</button>
</div>

<!-- RANKING -->
<div id="ranking" class="card" style="display:none">
  <h2>🏆 Ranking</h2>
  <ol id="list"></ol>
</div>

<script>
// ================= DATA =================
let semuaSoal = [
  {q:"Hewan tanpa kaki?", a:["Ular","Kucing","Ayam"], b:0},
  {q:"Ibukota Indonesia?", a:["Jakarta","Bandung","Surabaya"], b:0},
  {q:"Apa yang naik terus?", a:["Umur","Air","Bola"], b:0},
  {q:"Ayam bertelur di atap?", a:["Tidak","Kiri","Kanan"], b:0},
  {q:"Planet kita?", a:["Mars","Bumi","Venus"], b:1},
  {q:"2+2=?", a:["3","4","5"], b:1},
  {q:"Air mendidih?", a:["100°C","50°C","200°C"], b:0}
];

// ================= VAR =================
let soal = [];
let index = 0;
let score = 0;
let waktu = 10;
let nyawa = 3;
let streak = 0;
let timer;

// ================= START =================
function start(level){
  let nama = document.getElementById("nama").value;
  if(!nama) return alert("Isi nama!");

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="block";

  if(level=="easy") waktu=12;
  if(level=="medium") waktu=10;
  if(level=="hard") waktu=7;
  if(level=="extreme") waktu=5;

  soal = shuffle([...semuaSoal]);
  index=0; score=0; nyawa=3; streak=0;

  tampil();
}

// ================= ACAK =================
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// ================= TAMPIL =================
function tampil(){
  if(nyawa<=0){
    selesai();
    return;
  }

  if(index>=soal.length){
    soal = shuffle([...semuaSoal]);
    index=0;
  }

  let s = soal[index];
  document.getElementById("soal").innerText = s.q;

  let html="";
  s.a.forEach((j,i)=>{
    html += `<button onclick="jawab(${i})">${j}</button><br>`;
  });

  document.getElementById("jawaban").innerHTML = html;

  updateInfo();
  startTimer();
}

// ================= INFO =================
function updateInfo(){
  document.getElementById("info").innerText =
    "❤️ "+nyawa+" | 🔥 "+streak+" | 🏆 "+score;
}

// ================= JAWAB =================
function jawab(i){
  if(i===soal[index].b){
    document.getElementById("benar").play();
    streak++;
    score += 10 + (streak*2);

    if(waktu>3) waktu-=0.2;

  }else{
    document.getElementById("salah").play();
    nyawa--;
    streak=0;
  }

  index++;
  tampil();
}

// ================= TIMER =================
function startTimer(){
  let t = Math.floor(waktu);
  clearInterval(timer);

  timer = setInterval(()=>{
    t--;
    document.getElementById("info").innerText =
      "❤️ "+nyawa+" | 🔥 "+streak+" | 🏆 "+score+" | ⏱️ "+t;

    if(t<=0){
      clearInterval(timer);
      nyawa--;
      streak=0;
      index++;
      tampil();
    }
  },1000);
}

// ================= SELESAI =================
function selesai(){
  clearInterval(timer);

  document.getElementById("game").style.display="none";
  document.getElementById("hasil").style.display="block";

  document.getElementById("skor").innerText =
    "GAME OVER 😈 Skor: "+score;

  simpan();
}

// ================= SIMPAN =================
function simpan(){
  let nama = document.getElementById("nama").value;

  let data = JSON.parse(localStorage.getItem("rank")) || [];
  data.push({nama, skor:score});

  data.sort((a,b)=>b.skor-a.skor);
  localStorage.setItem("rank", JSON.stringify(data));
}

// ================= RANKING =================
function lihatRanking(){
  document.getElementById("hasil").style.display="none";
  document.getElementById("ranking").style.display="block";

  let data = JSON.parse(localStorage.getItem("rank")) || [];

  let html="";
  data.slice(0,10).forEach((d,i)=>{
    html += `<li>🏆 #${i+1} - ${d.nama} (${d.skor})</li>`;
  });

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
