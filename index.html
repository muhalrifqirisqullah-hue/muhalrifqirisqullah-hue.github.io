<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FINAL BOSS QUIZ 😈</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

#box{
  background:#1e293b;
  padding:10px;
  width:400px;
  margin:auto;
}

#leaderboard{
  text-align:left;
  margin-top:10px;
}

button{
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h2>💀 FINAL BOSS QUIZ ROOM</h2>

<input id="name" placeholder="Nama"><br>
<input id="room" placeholder="Room ID"><br>

<button onclick="join()">JOIN</button>
<button onclick="start()">START (HOST)</button>

<div id="box">
  <h3 id="timer">⏱️ 0</h3>
  <h2 id="q"></h2>
  <input id="a"><br>
  <button onclick="answer()">Jawab</button>

  <h3>🏆 Ranking</h3>
  <div id="leaderboard"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQqFX5Urj9Yhzj40cFS4EBQiDijjTRFo8",
  authDomain: "ullahh-f696a.firebaseapp.com",
  projectId: "ullahh-f696a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let room="", name="", score=0;
let correct="";
let timer=0;
let interval;

// JOIN
window.join = async function(){
  room = document.getElementById("room").value;
  name = document.getElementById("name").value;

  await setDoc(doc(db,"rooms",room,"players",name),{
    score:0
  });

  listen();
}

// LISTEN ROOM
function listen(){
  onSnapshot(doc(db,"rooms",room),(snap)=>{
    let d=snap.data();
    if(!d) return;

    document.getElementById("q").innerText = d.q;
    correct = d.a;
    startTimer(d.time);
  });

  loadRank();
}

// TIMER
function startTimer(t){
  clearInterval(interval);
  timer = t;

  interval = setInterval(()=>{
    timer--;
    document.getElementById("timer").innerText = "⏱️ "+timer;

    if(timer<=0) clearInterval(interval);
  },1000);
}

// SOAL
function getQ(){
  let list=[
    {q:"2+2=?",a:"4"},
    {q:"Hewan tanpa kaki?",a:"ular"},
    {q:"Lawan panas?",a:"dingin"},
    {q:"Ibukota Indonesia?",a:"jakarta"}
  ];
  return list[Math.floor(Math.random()*list.length)];
}

// HOST START
window.start = async function(){
  let q=getQ();

  await setDoc(doc(db,"rooms",room),{
    q:q.q,
    a:q.a,
    time:10
  });
}

// JAWAB
window.answer = async function(){
  let user=document.getElementById("a").value.toLowerCase();

  if(user==correct){
    score+=10;

    await updateDoc(doc(db,"rooms",room,"players",name),{
      score:score
    });

    alert("🔥 BENAR");
  }else{
    alert("❌ SALAH");
  }

  loadRank();
}

// LOAD RANKING
async function loadRank(){
  const snap = await getDocs(collection(db,"rooms",room,"players"));

  let arr=[];
  snap.forEach(d=>arr.push({name:d.id,...d.data()}));

  arr.sort((a,b)=>b.score-a.score);

  let html="";
  arr.forEach(p=>{
    html += `<div>${p.name} : ${p.score}</div>`;
  });

  document.getElementById("leaderboard").innerHTML = html;
}

</script>

</body>
</html>
