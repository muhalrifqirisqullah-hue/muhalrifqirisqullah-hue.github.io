<script>
let semuaSoal = [
  {q:"Hewan tanpa kaki?", a:["Ular","Kucing","Ayam"], b:0},
  {q:"Ibukota Indonesia?", a:["Jakarta","Bandung","Surabaya"], b:0},
  {q:"Apa yang naik terus?", a:["Umur","Air","Bola"], b:0},
  {q:"Ayam bertelur di atap?", a:["Kiri","Kanan","Tidak"], b:2},
  {q:"Planet kita?", a:["Mars","Bumi","Venus"], b:1},
  {q:"2+2=?", a:["3","4","5"], b:1},
  {q:"Air mendidih?", a:["100°C","50°C","200°C"], b:0}
];

let soal = [];
let index = 0;
let score = 0;
let waktu = 10;
let timer;
let nyawa = 3;
let streak = 0;

// START
function start(level){
  let nama = document.getElementById("nama").value;
  if(!nama) return alert("Isi nama!");

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="block";

  if(level=="easy"){waktu=12;}
  if(level=="medium"){waktu=10;}
  if(level=="hard"){waktu=7;}
  if(level=="extreme"){waktu=5;}

  soal = shuffle(semuaSoal);
  index = 0;
  score = 0;
  nyawa = 3;
  streak = 0;

  tampilSoal();
}

// ACAK
function shuffle(array){
  return array.sort(()=>Math.random()-0.5);
}

// TAMPIL
function tampilSoal(){
  if(nyawa <= 0){
    selesai();
    return;
  }

  if(index >= soal.length){
    soal = shuffle(semuaSoal); // infinite
    index = 0;
  }

  let s = soal[index];
  document.getElementById("soal").innerText = s.q;

  let html="";
  s.a.forEach((j,i)=>{
    html += `<button onclick="jawab(${i})">${j}</button><br>`;
  });

  document.getElementById("jawaban").innerHTML = html;

  document.getElementById("timer").innerText =
    "❤️ "+nyawa+" | 🔥 "+streak+" | 🏆 "+score;

  startTimer();
}

// JAWAB
function jawab(i){
  if(i === soal[index].b){
    streak++;

    let bonus = 10;

    if(streak >= 3) bonus = 20;
    if(streak >= 5) bonus = 30;

    score += bonus;

    // makin lama makin cepat
    if(waktu > 3) waktu -= 0.3;

  }else{
    nyawa--;
    streak = 0;
  }

  index++;
  tampilSoal();
}

// TIMER
function startTimer(){
  let t = Math.floor(waktu);

  clearInterval(timer);

  timer = setInterval(()=>{
    t--;
    document.getElementById("timer").innerText =
      "❤️ "+nyawa+" | 🔥 "+streak+" | 🏆 "+score+" | ⏱️ "+t;

    if(t <= 0){
      clearInterval(timer);
      nyawa--;
      streak = 0;
      index++;
      tampilSoal();
    }
  },1000);
}

// SELESAI
function selesai(){
  clearInterval(timer);

  document.getElementById("game").style.display="none";
  document.getElementById("hasil").style.display="block";

  document.getElementById("skor").innerText =
    "GAME OVER 😈 Skor: "+score;

  simpanLocal();
}

// SIMPAN
function simpanLocal(){
  let nama = document.getElementById("nama").value;

  let data = JSON.parse(localStorage.getItem("rank")) || [];
  data.push({nama, skor:score});

  data.sort((a,b)=>b.skor-a.skor);

  localStorage.setItem("rank", JSON.stringify(data));
}

// RANKING
function lihatRanking(){
  document.getElementById("hasil").style.display="none";
  document.getElementById("ranking").style.display="block";

  let data = JSON.parse(localStorage.getItem("rank")) || [];

  let html="";
  data.slice(0,10).forEach((d,i)=>{
    html += `<li>🏆 #${i+1} - ${d.nama} (${d.skor})</li>`;
  });

  document.getElementById("list").innerHTML = html;
}
                          </script>
