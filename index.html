<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ Battle Online 😈</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #1e1e2f, #3a3a6a);
  color: white;
}

.container {
  margin-top: 50px;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #ff4757;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

#question {
  font-size: 30px;
  margin: 20px;
}

input {
  padding: 10px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🔥 IQ Battle Online</h1>

  <input id="username" placeholder="Masukkan Nama"><br><br>

  <button onclick="findMatch()">🔥 Cari Lawan</button>

  <h2 id="status"></h2>
  <h1 id="question"></h1>

  <input id="answer" placeholder="Jawaban"><br><br>
  <button onclick="submitAnswer()">Jawab</button>

  <h3 id="result"></h3>

  <p style="margin-top:50px; font-size:12px;">By Ullah Dev 🚀</p>
</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script type="module">

// 🔥 IMPORT FIREBASE (WAJIB BEGINI)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔑 CONFIG KAMU (SUDAH DIPASANG)
const firebaseConfig = {
  apiKey: "AIzaSyCQqFX5Urj9Yhzj40cFS4EBQiDijjTRFo8",
  authDomain: "ullahh-f696a.firebaseapp.com",
  projectId: "ullahh-f696a",
  storageBucket: "ullahh-f696a.firebasestorage.app",
  messagingSenderId: "29708567375",
  appId: "1:29708567375:web:5097ef9d64fd9439b07b3a",
  measurementId: "G-5X2YQ3QKFM"
};

// 🚀 INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🎲 SOAL RANDOM
function randomQuestion() {
  let a = Math.floor(Math.random() * 10);
  let b = Math.floor(Math.random() * 10);
  return {
    q: `${a} + ${b} = ?`,
    a: (a + b).toString()
  };
}

let currentRoom = null;
let correctAnswer = "";

// 🔍 MATCHMAKING
window.findMatch = async function () {
  playSound();

  const username = document.getElementById("username").value;
  if (!username) return alert("Isi nama dulu!");

  document.getElementById("status").innerText = "Mencari lawan...";

  const roomsRef = collection(db, "rooms");
  const snapshot = await getDocs(roomsRef);

  let joined = false;

  snapshot.forEach(async (room) => {
    let data = room.data();

    if (data.status === "waiting" && !data.player2 && !joined) {
      await updateDoc(doc(db, "rooms", room.id), {
        player2: username,
        status: "playing"
      });
      joined = true;
      startBattle(room.id);
    }
  });

  if (!joined) {
    const q = randomQuestion();

    const newRoom = await addDoc(roomsRef, {
      player1: username,
      player2: null,
      status: "waiting",
      question: q.q,
      answer: q.a
    });

    startBattle(newRoom.id);
  }
};

// ⚔️ REALTIME
function startBattle(roomId) {
  currentRoom = roomId;

  const roomRef = doc(db, "rooms", roomId);

  onSnapshot(roomRef, (docSnap) => {
    const data = docSnap.data();
    if (!data) return;

    if (data.player2) {
      document.getElementById("status").innerText = "😈 Battle Dimulai!";
      document.getElementById("question").innerText = data.question;
      correctAnswer = data.answer;
    } else {
      document.getElementById("status").innerText = "Menunggu lawan...";
    }
  });
}

// ✅ JAWAB
window.submitAnswer = function () {
  playSound();

  const userAnswer = document.getElementById("answer").value;

  if (userAnswer === correctAnswer) {
    document.getElementById("result").innerText = "🔥 BENAR!";
  } else {
    document.getElementById("result").innerText = "❌ SALAH!";
  }
};

// 🔊 SOUND
function playSound() {
  document.getElementById("clickSound").play();
}

</script>

</body>
</html>
