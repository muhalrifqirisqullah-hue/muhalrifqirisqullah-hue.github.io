<!DOCTYPE html>
<html>
<head>
  <title>BrainRank World 🌍</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } 
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "ISI PUNYA KAMU",
      authDomain: "ISI PUNYA KAMU",
      projectId: "ISI PUNYA KAMU",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.simpanScore = async function(nama, skor){
      await addDoc(collection(db,"leaderboard"), {nama, skor});
    }

    window.ambilRanking = async function(){
      const q = query(collection(db,"leaderboard"), orderBy("skor","desc"), limit(10));
      const snap = await getDocs(q);
      let hasil = [];
      snap.forEach(doc => hasil.push(doc.data()));
      return hasil;
    }
  </script>
</head>

<body style="font-family:sans-serif;text-align:center;background:#111;color:white">

<div id="login">
  <h1>🧠 BrainRank World</h1>
  <input id="nama" placeholder="Masukkan nama"><br><br>

  <h3>Pilih Level</h3>
  <button onclick="start('easy')">Easy 😄</button>
  <button onclick="start('medium')">Medium 😎</button>
  <button onclick="start('hard')">Hard 😈</button>
  <button onclick="start('extreme')">Extreme 🔥</button>
</div>

<div id="game" style="display:none">
  <h2 id="timer"></h2>
  <h3 id="soal"></h3>
  <div id="jawaban"></div>
</div>

<div id="hasil" style="display:none">
  <h2 id="skor"></h2>
  <button onclick="lihatRanking()">Lihat Ranking</button>
</div>

<div id="ranking" style="display:none">
  <h2>🏆 Ranking Dunia</h2>
  <ol id="list"></ol>
</div>

<script>
let semuaSoal = [
  {q:"2+2=?", a:["3","4","5"], b:1},
  {q:"Hewan tanpa kaki?", a:["Ular","Kucing","Ayam"], b:0},
  {q:"Ibukota Indonesia?", a:["Jakarta","Bandung","Bali"], b:0},
  {q:"Apa yang naik terus?", a:["Umur","Air","Bola"], b:0},
  {q:"Ayam bertelur di atap?", a:["Kiri","Kanan","Tidak"], b:2},
  {q:"5x5=?", a:["10","20","25"], b:2},
  {q:"Planet kita?", a:["Mars","Bumi","Venus"], b:1},
  {q:"Air mendidih?", a:["100°C","50°C","200°C"], b:0}
];

let soal = [];
let index = 0;
let score = 0;
let waktu = 10;
let timer;

function start(level){
  let nama = document.getElementById("nama").value;
  if(!nama) return alert("Isi nama!");

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="block";

  // SET LEVEL
  if(level=="easy"){waktu=15;}
  if(level=="medium"){waktu=10;}
  if(level=="hard"){waktu=7;}
  if(level=="extreme"){waktu=5;}

  soal = semuaSoal.sort(()=>0.5-Math.random()).slice(0,5);
  index=0;
  score=0;
  tampilSoal();
}

function tampilSoal(){
  if(index>=soal.length){
    selesai();
    return;
  }

  let s = soal[index];
  document.getElementById("soal").innerText = s.q;

  let jawabanHTML="";
  s.a.forEach((j,i)=>{
    jawabanHTML += `<button onclick="jawab(${i})">${j}</button><br>`;
  });

  document.getElementById("jawaban").innerHTML = jawabanHTML;

  startTimer();
}

function jawab(i){
  if(i===soal[index].b){
    score+=10;
  }
  index++;
  tampilSoal();
}

function startTimer(){
  let t = waktu;
  document.getElementById("timer").innerText = "⏱️ "+t;

  clearInterval(timer);
  timer = setInterval(()=>{
    t--;
    document.getElementById("timer").innerText = "⏱️ "+t;

    if(t<=0){
      clearInterval(timer);
      index++;
      tampilSoal();
    }
  },1000);
}

async function selesai(){
  clearInterval(timer);

  document.getElementById("game").style.display="none";
  document.getElementById("hasil").style.display="block";

  let nama = document.getElementById("nama").value;
  document.getElementById("skor").innerText = "Skor kamu: "+score;

  await simpanScore(nama, score);
}

async function lihatRanking(){
  document.getElementById("hasil").style.display="none";
  document.getElementById("ranking").style.display="block";

  let data = await ambilRanking();
  let html="";
  data.forEach((d,i)=>{
    html += `<li>🏆 #${i+1} - ${d.nama} (${d.skor})</li>`;
  });

  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
