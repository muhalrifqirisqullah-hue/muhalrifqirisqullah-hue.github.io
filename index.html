<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GAME WORLD 😈</title>

<style>
body{
  background:#0f172a;
  color:white;
  text-align:center;
  font-family:Arial;
}

#game{
  width:400px;
  height:400px;
  background:#1e293b;
  margin:auto;
  position:relative;
  overflow:hidden;
}

#player{
  width:20px;
  height:20px;
  background:lime;
  position:absolute;
  top:50px;
  left:50px;
}

.box{
  width:20px;
  height:20px;
  background:red;
  position:absolute;
}

#quiz{
  margin-top:10px;
}
</style>
</head>

<body>

<h2>💀 GAME WORLD QUIZ</h2>

<div id="game">
  <div id="player"></div>
</div>

<div id="quiz">
  <h3 id="q"></h3>
  <input id="a">
  <button onclick="answer()">Jawab</button>
  <h3 id="score">Score: 0</h3>
</div>

<script>

let player=document.getElementById("player");
let x=50,y=50;
let score=0;
let correct="";
let boxEl;

// GERAK
document.addEventListener("keydown",e=>{
  if(e.key=="w") y-=10;
  if(e.key=="s") y+=10;
  if(e.key=="a") x-=10;
  if(e.key=="d") x+=10;

  player.style.top=y+"px";
  player.style.left=x+"px";

  checkHit();
});

// SPAWN BOX
function spawnBox(){
  if(boxEl) boxEl.remove();

  boxEl=document.createElement("div");
  boxEl.className="box";

  let bx=Math.random()*360;
  let by=Math.random()*360;

  boxEl.style.left=bx+"px";
  boxEl.style.top=by+"px";

  document.getElementById("game").appendChild(boxEl);
}

// DETEKSI SENTUH
function checkHit(){
  if(!boxEl) return;

  let px=x, py=y;
  let bx=parseInt(boxEl.style.left);
  let by=parseInt(boxEl.style.top);

  if(Math.abs(px-bx)<20 && Math.abs(py-by)<20){
    spawnQuestion();
    boxEl.remove();
  }
}

// SOAL
function getQ(){
  let list=[
    {q:"2+2=?",a:"4"},
    {q:"Hewan tanpa kaki?",a:"ular"},
    {q:"Warna langit?",a:"biru"},
    {q:"Lawan panas?",a:"dingin"}
  ];
  return list[Math.floor(Math.random()*list.length)];
}

function spawnQuestion(){
  let q=getQ();
  correct=q.a;
  document.getElementById("q").innerText=q.q;
}

// JAWAB
function answer(){
  let user=document.getElementById("a").value.toLowerCase();

  if(user==correct){
    score+=10;
    document.getElementById("score").innerText="Score: "+score;
    spawnBox();
  }else{
    alert("❌ Salah");
  }
}

// START
spawnBox();

</script>

</body>
</html>
