<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZEP Quiz Clone 😈</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

#game {
  width: 400px;
  height: 400px;
  margin: auto;
  position: relative;
  background: #1e293b;
  border: 3px solid #38bdf8;
}

.player {
  width: 30px;
  height: 30px;
  background: #22c55e;
  position: absolute;
  border-radius: 5px;
}

.box {
  width: 30px;
  height: 30px;
  background: #ef4444;
  position: absolute;
  border-radius: 5px;
}

#quizBox {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #020617;
  padding: 20px;
  display: none;
}

button {
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">🔥 ZEP QUIZ CLONE</h2>

<div id="game">
  <div id="player" class="player"></div>
</div>

<div id="quizBox">
  <h3 id="question"></h3>
  <input id="answer">
  <br>
  <button onclick="submitAnswer()">Jawab</button>
</div>

<script>

let game = document.getElementById("game");
let player = document.getElementById("player");

let x = 50, y = 50;
player.style.left = x+"px";
player.style.top = y+"px";

// GERAK KEYBOARD
document.addEventListener("keydown", e=>{
  if(e.key=="ArrowUp") y-=10;
  if(e.key=="ArrowDown") y+=10;
  if(e.key=="ArrowLeft") x-=10;
  if(e.key=="ArrowRight") x+=10;

  x=Math.max(0,Math.min(370,x));
  y=Math.max(0,Math.min(370,y));

  player.style.left=x+"px";
  player.style.top=y+"px";

  checkBox();
});

// SPAWN BANYAK BOX
let boxes=[];
for(let i=0;i<5;i++){
  let b=document.createElement("div");
  b.className="box";
  b.style.left=Math.random()*370+"px";
  b.style.top=Math.random()*370+"px";
  game.appendChild(b);
  boxes.push(b);
}

// SOAL
function randomQ(){
  const list=[
    {q:"Hewan tanpa kaki?",a:"ular"},
    {q:"2+3=?",a:"5"},
    {q:"Lawan panas?",a:"dingin"},
    {q:"Air jadi es jika?",a:"dingin"},
    {q:"Ibukota Indonesia?",a:"jakarta"}
  ];
  return list[Math.floor(Math.random()*list.length)];
}

let currentQ;

// CEK TABRAKAN
function checkBox(){
  boxes.forEach(b=>{
    let bx=parseInt(b.style.left);
    let by=parseInt(b.style.top);

    if(Math.abs(x-bx)<30 && Math.abs(y-by)<30){
      openQuiz();
      b.remove();
    }
  });
}

// BUKA QUIZ
function openQuiz(){
  currentQ=randomQ();
  document.getElementById("quizBox").style.display="block";
  document.getElementById("question").innerText=currentQ.q;
}

// JAWAB
function submitAnswer(){
  let ans=document.getElementById("answer").value.toLowerCase();

  if(ans==currentQ.a){
    alert("🔥 BENAR");
  }else{
    alert("❌ SALAH");
  }

  document.getElementById("quizBox").style.display="none";
  document.getElementById("answer").value="";
}

</script>

</body>
</html>
