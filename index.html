<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZEP FULL SYSTEM 😈</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.box{
  background:#1e293b;
  padding:10px;
  width:400px;
  margin:auto;
  margin-top:10px;
}

#chat{
  height:100px;
  overflow:auto;
  background:#020617;
  padding:5px;
  text-align:left;
}

input{
  padding:8px;
  margin:5px;
}

button{
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h2>💀 ZEP QUIZ FULL SYSTEM</h2>

<input id="name" placeholder="Nama"><br>
<input id="room" placeholder="Room ID"><br>
<button onclick="join()">JOIN</button>
<button onclick="start()">START (HOST)</button>

<div class="box" id="lobby">
  <h3>👥 Lobby</h3>
  <div id="players"></div>

  <h3>💬 Chat</h3>
  <div id="chat"></div>
  <input id="msg" placeholder="Ketik pesan">
  <button onclick="sendChat()">Kirim</button>

  <h3 id="status">Menunggu...</h3>
</div>

<div class="box">
  <h3 id="timer">⏱️</h3>
  <h2 id="q"></h2>
  <input id="a">
  <br>
  <button onclick="answer()">Jawab</button>

  <h3>🏆 Ranking</h3>
  <div id="rank"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQqFX5Urj9Yhzj40cFS4EBQiDijjTRFo8",
  authDomain: "ullahh-f696a.firebaseapp.com",
  projectId: "ullahh-f696a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let room="", name="", score=0;
let correct="", timer=0, interval;

// JOIN
window.join = async function(){
  room = document.getElementById("room").value;
  name = document.getElementById("name").value;

  await setDoc(doc(db,"rooms",room,"players",name),{
    score:0
  });

  listenRoom();
  listenPlayers();
  listenChat();
}

// LISTEN ROOM
function listenRoom(){
  onSnapshot(doc(db,"rooms",room),(snap)=>{
    let d=snap.data();
    if(!d) return;

    document.getElementById("status").innerText = d.status || "Menunggu";

    if(d.status=="start"){
      document.getElementById("lobby").style.display="none";
    }

    document.getElementById("q").innerText = d.q;
    correct = d.a;
    startTimer(d.time);
  });
}

// TIMER
function startTimer(t){
  clearInterval(interval);
  timer = t;

  interval = setInterval(()=>{
    timer--;
    document.getElementById("timer").innerText="⏱️ "+timer;
    if(timer<=0) clearInterval(interval);
  },1000);
}

// PLAYER LIST
function listenPlayers(){
  onSnapshot(collection(db,"rooms",room,"players"),(snap)=>{
    let html="";
    snap.forEach(p=>{
      html+=`<div>👤 ${p.id}</div>`;
    });
    document.getElementById("players").innerHTML=html;
  });
}

// CHAT
window.sendChat = async function(){
  let msg=document.getElementById("msg").value;

  await addDoc(collection(db,"rooms",room,"chat"),{
    name:name,
    text:msg
  });

  document.getElementById("msg").value="";
}

function listenChat(){
  onSnapshot(collection(db,"rooms",room,"chat"),(snap)=>{
    let html="";
    snap.forEach(c=>{
      let d=c.data();
      html+=`<div><b>${d.name}:</b> ${d.text}</div>`;
    });
    document.getElementById("chat").innerHTML=html;
  });
}

// SOAL
function getQ(){
  let list=[
    {q:"2+2=?",a:"4"},
    {q:"Hewan tanpa kaki?",a:"ular"},
    {q:"Lawan panas?",a:"dingin"},
    {q:"Ibukota Indonesia?",a:"jakarta"}
  ];
  return list[Math.floor(Math.random()*list.length)];
}

// START
window.start = async function(){
  let q=getQ();

  await setDoc(doc(db,"rooms",room),{
    q:q.q,
    a:q.a,
    time:10,
    status:"start"
  });
}

// JAWAB
window.answer = async function(){
  let user=document.getElementById("a").value.toLowerCase();

  if(user==correct){
    score+=10;

    await updateDoc(doc(db,"rooms",room,"players",name),{
      score:score
    });

    alert("🔥 BENAR");
  }else{
    alert("❌ SALAH");
  }

  loadRank();
}

// RANKING
async function loadRank(){
  const snap = await getDocs(collection(db,"rooms",room,"players"));

  let arr=[];
  snap.forEach(d=>arr.push({name:d.id,...d.data()}));

  arr.sort((a,b)=>b.score-a.score);

  let html="";
  arr.forEach(p=>{
    html+=`<div>${p.name} : ${p.score}</div>`;
  });

  document.getElementById("rank").innerHTML=html;
}

</script>

</body>
</html>
