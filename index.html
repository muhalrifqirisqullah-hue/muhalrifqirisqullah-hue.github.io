<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes IQ Mu Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,800;1,800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 4px solid #1e293b;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .square:hover { background-color: rgba(59, 130, 246, 0.3) !important; }
        .bg-light { background-color: #475569; }
        .bg-dark { background-color: #1e293b; }
        .selected { background-color: #3b82f6 !important; }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen flex flex-col p-6">
        <!-- Home Screen -->
        <div id="home-view" class="max-w-2xl mx-auto w-full py-12 text-center">
            <div class="mb-12">
                <p class="text-blue-500 font-bold tracking-[0.3em] text-[10px] uppercase mb-4">Muh Alrifqi Risqullah Present</p>
                <h1 class="text-6xl font-black italic tracking-tighter mb-2">TES <span class="text-blue-600">IQ</span> MU</h1>
                <p class="text-slate-500 text-sm">Platform Uji Kecerdasan & Strategi Terbaik</p>
            </div>

            <div class="grid grid-cols-1 gap-4 mb-12">
                <button onclick="showIQSetup()" class="glass p-8 rounded-[40px] flex items-center justify-between hover:bg-blue-600 transition-all group">
                    <div class="text-left">
                        <h3 class="text-2xl font-black italic uppercase">Tes IQ</h3>
                        <p class="text-slate-400 text-xs group-hover:text-blue-100">Ukur logika dan pola pikirmu</p>
                    </div>
                    <span class="text-4xl">🧠</span>
                </button>

                <button onclick="startChess()" class="glass p-8 rounded-[40px] flex items-center justify-between hover:bg-indigo-600 transition-all group">
                    <div class="text-left">
                        <h3 class="text-2xl font-black italic uppercase">Catur vs AI</h3>
                        <p class="text-slate-400 text-xs group-hover:text-indigo-100">Latih strategi lawan komputer</p>
                    </div>
                    <span class="text-4xl">♟️</span>
                </button>
            </div>

            <div class="glass p-8 rounded-[40px] text-left">
                <h3 class="font-black italic mb-4 flex items-center gap-2">🏆 PAPAN SKOR</h3>
                <div id="leaderboard-list" class="space-y-3">
                    <p class="text-slate-500 text-sm">Mainkan Tes IQ untuk melihat namamu di sini!</p>
                </div>
            </div>
        </div>

        <!-- IQ Setup Modal -->
        <div id="iq-setup" class="hidden fixed inset-0 glass z-50 flex items-center justify-center p-6 text-center">
            <div class="bg-slate-900 p-10 rounded-[50px] border border-white/10 w-full max-w-sm">
                <h2 class="text-3xl font-black italic mb-2 uppercase">JUMLAH SOAL</h2>
                <p class="text-slate-500 text-sm mb-8">Setiap soal benar bernilai 10 poin</p>
                <div class="flex justify-center gap-4 mb-8">
                    <button onclick="setQuestions(3)" class="q-btn w-14 h-14 rounded-2xl bg-slate-800 font-bold hover:bg-blue-600 transition-all" id="btn-3">3</button>
                    <button onclick="setQuestions(5)" class="q-btn w-14 h-14 rounded-2xl bg-blue-600 font-bold" id="btn-5">5</button>
                    <button onclick="setQuestions(10)" class="q-btn w-14 h-14 rounded-2xl bg-slate-800 font-bold hover:bg-blue-600 transition-all" id="btn-10">10</button>
                </div>
                <button onclick="startIQ()" class="w-full bg-white text-black py-5 rounded-2xl font-black italic text-xl">MULAI TES</button>
                <button onclick="hideIQSetup()" class="mt-6 text-slate-500 text-sm font-bold uppercase">Batal</button>
            </div>
        </div>

        <!-- Game View -->
        <div id="game-view" class="hidden max-w-xl mx-auto w-full py-6 flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-8">
                <h2 id="game-title" class="text-2xl font-black italic uppercase">GAME</h2>
                <button onclick="exitGame()" class="bg-red-500/20 text-red-500 p-3 px-6 rounded-full font-bold text-xs">EXIT</button>
            </div>

            <!-- IQ Quiz Content -->
            <div id="iq-content" class="w-full">
                <div class="mb-8">
                    <div class="flex justify-between text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">
                        <span id="iq-progress">Soal 1 / 5</span>
                        <span id="iq-score-display" class="text-blue-500">Skor: 0</span>
                    </div>
                    <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
                        <div id="iq-bar" class="h-full bg-blue-600 transition-all" style="width: 20%"></div>
                    </div>
                </div>
                <h3 id="iq-question" class="text-2xl font-bold mb-10 leading-tight">...</h3>
                <div id="iq-options" class="grid grid-cols-1 gap-4">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Chess Content -->
            <div id="chess-content" class="hidden w-full flex flex-col items-center">
                <div class="chess-board mb-8" id="board"></div>
                <div class="flex gap-4 mb-4">
                    <div id="turn-white" class="px-6 py-2 rounded-full bg-white text-black font-black text-xs uppercase transition-all">Anda (Putih)</div>
                    <div id="turn-black" class="px-6 py-2 rounded-full bg-slate-800 text-slate-500 font-black text-xs uppercase transition-all">AI (Hitam)</div>
                </div>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Klik bidak putih Anda untuk mulai</p>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let iqTotal = 5;
        let iqIndex = 0;
        let iqScore = 0;
        let activeQuestions = [];

        const questionBank = [
            { q: "Manakah yang lebih berat? 1kg Besi atau 1kg Kapas?", a: ["Besi", "Kapas", "Sama Berat"], c: 2 },
            { q: "Jika 1+4=5, 2+5=12, maka 3+6=?", a: ["9", "21", "18"], c: 1 },
            { q: "Pola: 2, 4, 8, 16, ...?", a: ["24", "32", "64"], c: 1 },
            { q: "Ibu Budi memiliki 3 anak: Ali, Ani, dan siapa anak ketiganya?", a: ["Budi", "Abu", "Cici"], c: 0 },
            { q: "Bulan apa yang memiliki 28 hari?", a: ["Februari saja", "Semua bulan", "Januari"], c: 1 },
            { q: "Jika Anda menyalip orang di posisi kedua, Anda sekarang di posisi?", a: ["Pertama", "Kedua", "Ketiga"], c: 1 },
            { q: "Ada berapa angka 9 antara 1 sampai 100?", a: ["10", "19", "20"], c: 2 },
            { q: "Seorang petani memiliki 17 domba. Semua kecuali 9 mati. Berapa domba yang tersisa?", a: ["8", "9", "17"], c: 1 }
        ];

        // Chess State
        const pieces = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
        };
        let boardState = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];
        let selected = null;
        let isWhiteTurn = true;

        // Navigation
        function showIQSetup() { document.getElementById('iq-setup').classList.remove('hidden'); }
        function hideIQSetup() { document.getElementById('iq-setup').classList.add('hidden'); }
        
        function setQuestions(n) {
            iqTotal = n;
            document.querySelectorAll('.q-btn').forEach(b => b.classList.replace('bg-blue-600', 'bg-slate-800'));
            document.getElementById('btn-' + n).classList.replace('bg-slate-800', 'bg-blue-600');
        }

        function startIQ() {
            hideIQSetup();
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('iq-content').classList.remove('hidden');
            document.getElementById('chess-content').classList.add('hidden');
            document.getElementById('game-title').innerText = "TES IQ";
            
            iqIndex = 0;
            iqScore = 0;
            activeQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, iqTotal);
            renderQuestion();
        }

        function renderQuestion() {
            // Validasi indeks sebelum merender untuk mencegah error undefined 'q'
            if (!activeQuestions[iqIndex]) return;

            const q = activeQuestions[iqIndex];
            document.getElementById('iq-progress').innerText = `Soal ${iqIndex + 1} / ${iqTotal}`;
            document.getElementById('iq-score-display').innerText = `Skor: ${iqScore}`;
            document.getElementById('iq-bar').style.width = ((iqIndex + 1) / iqTotal * 100) + '%';
            document.getElementById('iq-question').innerText = q.q;
            
            const optionsDiv = document.getElementById('iq-options');
            optionsDiv.innerHTML = '';
            q.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'glass p-6 rounded-2xl text-left font-bold hover:bg-blue-600 transition-all';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx);
                optionsDiv.appendChild(btn);
            });
        }

        function handleAnswer(idx) {
            // Cek jawaban
            if (idx === activeQuestions[iqIndex].c) iqScore += 10;
            
            // Cek apakah masih ada soal berikutnya
            if (iqIndex < iqTotal - 1) {
                iqIndex++;
                renderQuestion();
            } else {
                // Selesai
                setTimeout(() => {
                    alert("Selesai! Skor Akhir Kamu: " + iqScore);
                    saveLeaderboard(iqScore);
                    exitGame();
                }, 100);
            }
        }

        function saveLeaderboard(score) {
            const list = document.getElementById('leaderboard-list');
            const emptyMsg = list.querySelector('p');
            if (emptyMsg) emptyMsg.remove();

            const entry = document.createElement('div');
            entry.className = "flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/5 animate-pulse";
            entry.innerHTML = `
                <span class="font-bold">✨ Skor Terakhir</span>
                <span class="text-blue-500 font-black">${score} IQ</span>
            `;
            list.prepend(entry);
        }

        // Chess Logic
        function startChess() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('iq-content').classList.add('hidden');
            document.getElementById('chess-content').classList.remove('hidden');
            document.getElementById('game-title').innerText = "CATUR vs AI";
            initChess();
        }

        function initChess() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r + c) % 2 === 0 ? 'bg-light' : 'bg-dark'}`;
                    sq.id = `sq-${r}-${c}`;
                    sq.innerText = boardState[r][c] ? pieces[boardState[r][c]] : '';
                    sq.onclick = () => handleChessClick(r, c);
                    boardDiv.appendChild(sq);
                }
            }
        }

        function handleChessClick(r, c) {
            if (!isWhiteTurn) return;
            const piece = boardState[r][c];

            if (selected) {
                const [sr, sc] = selected;
                // Move logic (simple)
                boardState[r][c] = boardState[sr][sc];
                boardState[sr][sc] = null;
                selected = null;
                renderBoard();
                isWhiteTurn = false;
                updateTurnUI();
                setTimeout(aiMove, 600);
            } else {
                if (piece && piece === piece.toUpperCase()) {
                    selected = [r, c];
                    renderBoard();
                    document.getElementById(`sq-${r}-${c}`).classList.add('selected');
                }
            }
        }

        function aiMove() {
            let aiPieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c] && boardState[r][c] === boardState[r][c].toLowerCase()) aiPieces.push([r, c]);
                }
            }
            if (aiPieces.length > 0) {
                const [sr, sc] = aiPieces[Math.floor(Math.random() * aiPieces.length)];
                const nr = Math.min(sr + 1, 7);
                const nc = Math.max(0, Math.min(sc + (Math.random() > 0.5 ? 1 : -1), 7));
                boardState[nr][nc] = boardState[sr][sc];
                boardState[sr][sc] = null;
            }
            isWhiteTurn = true;
            updateTurnUI();
            renderBoard();
        }

        function updateTurnUI() {
            if (isWhiteTurn) {
                document.getElementById('turn-white').className = 'px-6 py-2 rounded-full bg-white text-black font-black text-xs uppercase transition-all';
                document.getElementById('turn-black').className = 'px-6 py-2 rounded-full bg-slate-800 text-slate-500 font-black text-xs uppercase transition-all';
            } else {
                document.getElementById('turn-black').className = 'px-6 py-2 rounded-full bg-blue-600 text-white font-black text-xs uppercase transition-all';
                document.getElementById('turn-white').className = 'px-6 py-2 rounded-full bg-slate-800 text-slate-500 font-black text-xs uppercase transition-all';
            }
        }

        function renderBoard() {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.getElementById(`sq-${r}-${c}`);
                    sq.innerText = boardState[r][c] ? pieces[boardState[r][c]] : '';
                    sq.classList.remove('selected');
                }
            }
        }

        function exitGame() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('game-view').classList.add('hidden');
            boardState = [
                ['r','n','b','q','k','b','n','r'], ['p','p','p','p','p','p','p','p'],
                [null,null,null,null,null,null,null,null], [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null], [null,null,null,null,null,null,null,null],
                ['P','P','P','P','P','P','P','P'], ['R','N','B','Q','K','B','N','R']
            ];
            isWhiteTurn = true;
            selected = null;
        }

    </script>
</body>
</html>
