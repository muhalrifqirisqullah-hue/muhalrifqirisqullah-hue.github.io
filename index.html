<!DOCTYPE html>
<html>
<head>
  <title>Quiz Ulaa Ultimate 🚀</title>
  <style>
    body{
      background:linear-gradient(135deg,#020617,#0f172a);
      color:white;
      font-family:sans-serif;
      text-align:center;
    }

    h1{color:#38bdf8;}

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:20px;
      margin:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    button{
      padding:10px;
      margin:5px;
      border:none;
      border-radius:12px;
      background:#f97316;
      color:white;
      font-size:16px;
    }

    input{
      padding:10px;
      border-radius:10px;
      border:none;
    }

    .bar{
      height:10px;
      background:#334155;
      border-radius:10px;
      margin:10px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:#38bdf8;
      width:0%;
    }
  </style>
</head>
<body>

<div id="login" class="card">
  <h1>🚀 Quiz Ultimate</h1>
  <input id="namaInput" placeholder="Nama kamu"><br><br>
  <button onclick="mulai()">Mulai</button>
</div>

<div id="quiz" class="card" style="display:none;">
  <div class="bar"><div id="progress" class="fill"></div></div>
  <h2 id="pertanyaan"></h2>
  <p>⏱️ <span id="timer">10</span>s</p>
  <div id="jawaban"></div>
</div>

<div id="hasil" class="card" style="display:none;">
  <h2>🔥 Skor: <span id="skor"></span></h2>
  <h3>🏆 Rank: <span id="rank"></span></h3>
  <button onclick="lihatRanking()">Leaderboard</button>
</div>

<div id="ranking" class="card" style="display:none;">
  <h2>🌍 Global Ranking</h2>
  <ul id="leaderboard"></ul>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  projectId: "ullahh-f696a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// SOAL
let soal = [
  {q:"2+2?",a:["3","4","5"],b:1},
  {q:"5x2?",a:["10","8","6"],b:0},
  {q:"IQ: 2,4,8,?",a:["16","12","10"],b:0},
  {q:"3²?",a:["6","9","12"],b:1}
];

let i=0, skor=0, nama="", timer, waktu=10;

// START
function mulai(){
  nama = document.getElementById("namaInput").value;
  if(!nama){alert("Isi nama!");return;}

  document.getElementById("login").style.display="none";
  document.getElementById("quiz").style.display="block";

  tampil();
}

// TIMER
function startTimer(){
  waktu=10;
  document.getElementById("timer").innerText=waktu;

  timer=setInterval(()=>{
    waktu--;
    document.getElementById("timer").innerText=waktu;

    if(waktu<=0){
      clearInterval(timer);
      i++; next();
    }
  },1000);
}

// TAMPIL SOAL
function tampil(){
  let s=soal[i];
  document.getElementById("pertanyaan").innerText=s.q;

  let jwb=document.getElementById("jawaban");
  jwb.innerHTML="";

  s.a.forEach((j,index)=>{
    let btn=document.createElement("button");
    btn.innerText=j;
    btn.onclick=()=>{
      clearInterval(timer);
      if(index==s.b) skor+=10;
      i++; next();
    };
    jwb.appendChild(btn);
  });

  // progress bar
  document.getElementById("progress").style.width =
    ((i/soal.length)*100)+"%";

  startTimer();
}

// NEXT
function next(){
  if(i<soal.length){
    tampil();
  } else {
    selesai();
  }
}

// RANK SYSTEM
function getRank(s){
  if(s<20) return "Bronze 🟤";
  if(s<40) return "Silver ⚪";
  if(s<60) return "Gold 🟡";
  if(s<80) return "Platinum 🔵";
  return "Diamond 💎";
}

// SELESAI
function selesai(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("hasil").style.display="block";

  document.getElementById("skor").innerText=skor;
  document.getElementById("rank").innerText=getRank(skor);

  db.collection("leaderboard").add({
    nama:nama,
    skor:skor
  });
}

// RANKING
function lihatRanking(){
  document.getElementById("hasil").style.display="none";
  document.getElementById("ranking").style.display="block";
}

db.collection("leaderboard")
.orderBy("skor","desc")
.limit(100)
.onSnapshot(snap=>{
  let list=document.getElementById("leaderboard");
  list.innerHTML="";

  snap.forEach((doc,i)=>{
    let d=doc.data();
    let li=document.createElement("li");
    li.innerHTML=`🏆 #${i+1} ${d.nama} - ${d.skor}`;
    list.appendChild(li);
  });
});
</script>

</body>
</html>
