<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZEP ONLINE 😈</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  text-align:center;
}

#game{
  width:400px;
  height:400px;
  margin:auto;
  position:relative;
  background:#1e293b;
}

.player{
  width:25px;
  height:25px;
  position:absolute;
  border-radius:5px;
}
</style>
</head>

<body>

<h2>🌍 ZEP ONLINE ROOM</h2>

<input id="name" placeholder="Nama">
<input id="room" placeholder="Room ID">
<button onclick="joinRoom()">Join</button>

<div id="game"></div>

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQqFX5Urj9Yhzj40cFS4EBQiDijjTRFo8",
  authDomain: "ullahh-f696a.firebaseapp.com",
  projectId: "ullahh-f696a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DATA PLAYER
let playerId = Math.random().toString(36).substr(2,5);
let roomId = "";
let x=50, y=50;

// JOIN ROOM
window.joinRoom = function(){
  roomId = document.getElementById("room").value;
  if(!roomId) return alert("Isi room!");

  listenPlayers();
}

// GERAK
document.addEventListener("keydown", async (e)=>{
  if(!roomId) return;

  if(e.key=="ArrowUp") y-=5;
  if(e.key=="ArrowDown") y+=5;
  if(e.key=="ArrowLeft") x-=5;
  if(e.key=="ArrowRight") x+=5;

  x=Math.max(0,Math.min(375,x));
  y=Math.max(0,Math.min(375,y));

  await setDoc(doc(db,"rooms",roomId,"players",playerId),{
    x,y
  });
});

// LISTEN REALTIME
function listenPlayers(){
  const playersRef = doc(db,"rooms",roomId);

  onSnapshot(playersRef,()=>{
    loadPlayers();
  });

  loadPlayers();
}

// LOAD PLAYER
import { getDocs, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function loadPlayers(){
  const snap = await getDocs(collection(db,"rooms",roomId,"players"));

  const game = document.getElementById("game");
  game.innerHTML="";

  snap.forEach(p=>{
    let d=p.data();

    let div=document.createElement("div");
    div.className="player";
    div.style.left=d.x+"px";
    div.style.top=d.y+"px";
    div.style.background="#"+Math.floor(Math.random()*999999);

    game.appendChild(div);
  });
}

</script>

</body>
</html>
