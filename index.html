<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ GOD FINAL 💀</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
}
input{
  padding:10px;
}
</style>
</head>

<body>

<h1>💀 IQ GOD FINAL</h1>

<h2 id="q"></h2>
<input id="a">
<br><br>
<button onclick="check()">Jawab</button>
<button onclick="next()">Next</button>

<h3 id="res"></h3>
<h3>XP: <span id="xp">0</span></h3>

<script>

// ===== GENERATOR 1 JUTA SOAL =====
function generateQuestion(){

  let type = Math.floor(Math.random()*5);

  // 1. MATEMATIKA
  if(type===0){
    let a = Math.floor(Math.random()*50);
    let b = Math.floor(Math.random()*50);
    return {q:`${a} + ${b} = ?`, a:(a+b).toString()};
  }

  // 2. LOGIKA
  if(type===1){
    let arr = ["ular","ikan","burung"];
    return {q:"Hewan tanpa kaki?", a:"ular"};
  }

  // 3. BAHASA
  if(type===2){
    return {q:"Lawan kata 'panas'?", a:"dingin"};
  }

  // 4. PSIKOLOGI (pilihan)
  if(type===3){
    return {q:"Kamu pilih A atau B? (jawab A/B)", a:"a"};
  }

  // 5. POLA
  if(type===4){
    return {q:"2,4,6,8,...?", a:"10"};
  }

}

let current;
let xp = localStorage.getItem("xp") || 0;

document.getElementById("xp").innerText = xp;

// NEXT
function next(){
  current = generateQuestion();
  document.getElementById("q").innerText = current.q;
  document.getElementById("a").value = "";
  document.getElementById("res").innerText = "";
}

// CHECK
function check(){
  let user = document.getElementById("a").value.toLowerCase();

  if(user == current.a){
    document.getElementById("res").innerText = "🔥 BENAR";
    xp = parseInt(xp) + 10;
  }else{
    document.getElementById("res").innerText = "❌ SALAH";
  }

  document.getElementById("xp").innerText = xp;
  localStorage.setItem("xp", xp);
}

// START
next();

</script>

</body>
</html>
