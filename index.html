<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IQ Adventure 😈</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  text-align: center;
}

#game {
  position: relative;
  width: 300px;
  height: 300px;
  margin: auto;
  background: #222;
  border: 2px solid white;
}

.player {
  width: 30px;
  height: 30px;
  background: lime;
  position: absolute;
}

.box {
  width: 30px;
  height: 30px;
  background: red;
  position: absolute;
}

button {
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<h2>💀 IQ Adventure</h2>
<p>XP: <span id="xp">0</span></p>

<div id="game">
  <div id="player" class="player"></div>
  <div id="box" class="box"></div>
</div>

<br>

<button onclick="move(0,-10)">⬆️</button><br>
<button onclick="move(-10,0)">⬅️</button>
<button onclick="move(10,0)">➡️</button><br>
<button onclick="move(0,10)">⬇️</button>

<script>

let player = document.getElementById("player");
let box = document.getElementById("box");

let x = 0, y = 0;
let xp = 0;

// posisi awal
player.style.left = x + "px";
player.style.top = y + "px";

spawnBox();

// GERAK
function move(dx, dy){
  x += dx;
  y += dy;

  // batas map
  if(x < 0) x = 0;
  if(y < 0) y = 0;
  if(x > 270) x = 270;
  if(y > 270) y = 270;

  player.style.left = x + "px";
  player.style.top = y + "px";

  checkCollision();
}

// SPAWN BOX
function spawnBox(){
  let bx = Math.floor(Math.random()*270);
  let by = Math.floor(Math.random()*270);

  box.style.left = bx + "px";
  box.style.top = by + "px";
}

// DETEKSI TABRAKAN
function checkCollision(){
  let px = x;
  let py = y;

  let bx = parseInt(box.style.left);
  let by = parseInt(box.style.top);

  if(Math.abs(px - bx) < 30 && Math.abs(py - by) < 30){
    askQuestion();
    spawnBox();
  }
}

// SOAL RANDOM
function getQuestion(){
  let list = [
    {q:"Hewan tanpa kaki?", a:"ular"},
    {q:"Apa lawan dari sedih?", a:"senang"},
    {q:"Jika kamu sendirian, kamu merasa? (baik/buruk)", a:"baik"},
    {q:"2+5=?", a:"7"},
    {q:"Air jadi es jika?", a:"dingin"}
  ];
  return list[Math.floor(Math.random()*list.length)];
}

// TANYA
function askQuestion(){
  let q = getQuestion();
  let jawab = prompt(q.q);

  if(jawab && jawab.toLowerCase() == q.a){
    alert("🔥 BENAR");
    xp += 10;
  }else{
    alert("❌ SALAH");
  }

  document.getElementById("xp").innerText = xp;
}

</script>

</body>
</html>
