<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ GAME EXTREME 😈</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1e1e2f, #3a3a6a);
  color: white;
  text-align: center;
  transition: 0.5s;
}

.screen { display: none; padding: 20px; }
.active { display: block; }

button {
  padding: 15px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #ff4757;
  color: white;
  font-size: 18px;
}

input {
  padding: 10px;
  font-size: 18px;
}

.light {
  background: #f5f5f5;
  color: black;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="screen active">
  <h1>🔥 IQ GAME</h1>
  <button onclick="show('battle')">⚔️ Battle Online</button><br>
  <button onclick="show('solo')">🎯 Main Sendiri</button><br>
  <button onclick="show('settings')">⚙️ Pengaturan</button>
</div>

<!-- BATTLE -->
<div id="battle" class="screen">
  <h2>⚔️ Battle</h2>
  <input id="username" placeholder="Nama"><br>
  <button onclick="findMatch()">Cari Lawan</button>
  <h3 id="status"></h3>
  <h2 id="question"></h2>
  <input id="answer" placeholder="Jawaban">
  <button onclick="submitAnswer()">Jawab</button>
  <button onclick="show('menu')">⬅️ Kembali</button>
</div>

<!-- SOLO -->
<div id="solo" class="screen">
  <h2>🎯 Solo Mode</h2>
  <h2 id="soloQ"></h2>
  <input id="soloA">
  <button onclick="checkSolo()">Jawab</button>
  <h3 id="soloResult"></h3>
  <button onclick="nextSolo()">Next</button><br>
  <button onclick="show('menu')">⬅️ Kembali</button>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen">
  <h2>⚙️ Pengaturan</h2>
  <button onclick="toggleTheme()">🌗 Ganti Tema</button><br>
  <button onclick="show('menu')">⬅️ Kembali</button>
</div>

<audio id="click" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQqFX5Urj9Yhzj40cFS4EBQiDijjTRFo8",
  authDomain: "ullahh-f696a.firebaseapp.com",
  projectId: "ullahh-f696a",
  storageBucket: "ullahh-f696a.firebasestorage.app",
  messagingSenderId: "29708567375",
  appId: "1:29708567375:web:5097ef9d64fd9439b07b3a",
  measurementId: "G-5X2YQ3QKFM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// NAVIGASI
window.show = function(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  sound();
}

// SOUND
function sound(){
  document.getElementById("click").play();
}

// ====== SOAL CAMPURAN ======
function randomQ(){
  const list = [
    {q:"2+2=?",a:"4"},
    {q:"Hewan tanpa kaki?",a:"ular"},
    {q:"5x3=?",a:"15"},
    {q:"Ibukota Jepang?",a:"tokyo"},
    {q:"Air beku jadi?",a:"es"}
  ];
  return list[Math.floor(Math.random()*list.length)];
}

// ====== SOLO MODE ======
let soloNow;

window.nextSolo = function(){
  soloNow = randomQ();
  document.getElementById("soloQ").innerText = soloNow.q;
  document.getElementById("soloResult").innerText = "";
  document.getElementById("soloA").value = "";
}

window.checkSolo = function(){
  let ans = document.getElementById("soloA").value.toLowerCase();
  if(ans === soloNow.a){
    document.getElementById("soloResult").innerText = "🔥 BENAR!";
  }else{
    document.getElementById("soloResult").innerText = "❌ SALAH!";
  }
}

// ====== BATTLE ONLINE ======
let correctAnswer = "";

window.findMatch = async function(){
  sound();
  let name = document.getElementById("username").value;
  if(!name) return alert("Isi nama!");

  document.getElementById("status").innerText="Mencari...";

  const rooms = collection(db,"rooms");
  const snap = await getDocs(rooms);

  let joined=false;

  snap.forEach(async r=>{
    let d=r.data();
    if(d.status=="waiting" && !d.player2 && !joined){
      await updateDoc(doc(db,"rooms",r.id),{
        player2:name,status:"playing"
      });
      joined=true;
      start(r.id);
    }
  });

  if(!joined){
    let q=randomQ();
    let newR=await addDoc(rooms,{
      player1:name,player2:null,status:"waiting",
      question:q.q,answer:q.a
    });
    start(newR.id);
  }
}

function start(id){
  const ref=doc(db,"rooms",id);
  onSnapshot(ref,(snap)=>{
    let d=snap.data();
    if(d.player2){
      document.getElementById("status").innerText="😈 MULAI!";
      document.getElementById("question").innerText=d.question;
      correctAnswer=d.answer;
    }else{
      document.getElementById("status").innerText="Tunggu lawan...";
    }
  });
}

window.submitAnswer=function(){
  sound();
  let ans=document.getElementById("answer").value.toLowerCase();
  if(ans===correctAnswer){
    alert("🔥 MENANG!");
  }else{
    alert("❌ SALAH!");
  }
}

// ====== SETTINGS ======
window.toggleTheme=function(){
  document.body.classList.toggle("light");
}

// AUTO START SOLO
nextSolo();

</script>

</body>
</html>
